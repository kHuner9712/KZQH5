name: One-shot Clean Product Contract PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/product-request-contract
          fetch-depth: 0

      - name: Restore unrelated file and remove one-shot workflow
        shell: bash
        run: |
          git checkout origin/main -- docs/FUNCTIONAL_ACCEPTANCE_CHECKLIST.md
          git rm .github/workflows/one-shot-clean-product-contract-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove unrelated line-ending change"
          git push origin HEAD:fix/product-request-contract
