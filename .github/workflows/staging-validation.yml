name: Staging validation

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: EdgeOne Staging base URL
        required: true
        type: string
      allow_writes:
        description: Run explicitly marked Staging write tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# ============================================================
# Phase 2 Task 3: Staging validation upgraded to release gate.
#
# The read-only validation is now a reusable workflow
# (staging-read-only-validation.yml) that can be called by:
#   - This workflow (manual dispatch)
#   - production-deploy-verify.yml (post-deploy smoke)
#
# Write tests remain explicitly gated by inputs.allow_writes
# and the staging Environment approval. They are never run in
# a normal PR or post-deploy smoke flow.
# ============================================================

jobs:
  # -------------------------------------------------------
  # Read-only validation (reusable workflow)
  # -------------------------------------------------------
  read-only:
    uses: ./.github/workflows/staging-read-only-validation.yml
    with:
      base_url: ${{ inputs.base_url }}
    secrets: inherit

  # -------------------------------------------------------
  # Write tests (explicitly enabled, never automatic)
  # -------------------------------------------------------
  explicitly-enabled-writes:
    if: ${{ inputs.allow_writes }}
    needs: read-only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Marked write Smoke
        # Marked-write smoke is the only step that legitimately needs
        # service role for direct diagnostic writes, isolated here.
        run: npm run test:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_TEST_ALLOW_WRITES: "true"
          KZQ_STAGING_CONFIRMATION: KZQ-STAGING-ONLY
      - name: Marked write public E2E
        run: npx playwright test tests/e2e/staging-public.spec.ts --retries=0
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_E2E_ALLOW_WRITES: "true"
          KZQ_STAGING_CONFIRMATION: KZQ-STAGING-ONLY
      - name: Marked write admin E2E
        run: npx playwright test tests/e2e/staging-admin.spec.ts --workers=1 --retries=0
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_E2E_ALLOW_WRITES: "true"
          KZQ_STAGING_CONFIRMATION: KZQ-STAGING-ONLY
